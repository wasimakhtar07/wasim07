<body>
    <table border="2">
        <tr>
            <th>Exam id</th>
            <th>Student id</th>
            <th>Course id</th>
            <th>Remarks</th>
        </tr>
        {% for col in data %}
        <tr>
            <td>{{col[0]}}</td>
            <td>{{col[1]}}</td>
            <td>{{col[2]}}</td>
            <td>{{col[3]}}</td>
        </tr>
        {% endfor %}
        <input type=button value="Print" onclick="window.print()">
    </body>
</table>
</html>
