<body>
    <table border="2">
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Salary</th>
            <th>New Salary</th>
        </tr>
        {% for col in data %}
        <tr>
            <td>{{col[0]}}</td>
            <td>{{col[1]}}</td>
            <td>{{col[2]}}</td>
            <td>{{col[3]}}</td>
        </tr>
        {% endfor %}
        <input type=button value="Print" onclick="window.print()">
    </body>
</table>
</html>
