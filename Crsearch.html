<body>
    <table border="2">
        <tr>
            <th>Classroom id</th>
            <th>Year</th>
            <th>Grade id</th>
            <th>Section</th>
             <th>Status</th>
              <th>Remarks</th>
            <th>Teacher id</th>
        </tr>
        {% for col in data %}
        <tr>
            <td>{{col[0]}}</td>
            <td>{{col[1]}}</td>
            <td>{{col[2]}}</td>
            <td>{{col[3]}}</td>
             <td>{{col[4]}}</td>
            <td>{{col[5]}}</td>
            <td>{{col[6]}}</td>
        </tr>
        {% endfor %}
        <input type=button value="Print" onclick="window.print()">
    </body>
</table>
</html>
